[package]
name = "yoda"
version = "0.1.0"
edition = "2024"
description = "A local-first, model-agnostic agentic harness driven by open-source models."

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
reqwest = { version = "0.12", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
async-trait = "0.1"
anyhow = "1"
glob = "0.3"
